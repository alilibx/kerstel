name: Nightly
# AGENTS.md, "Nightly builds". Publishes kerstel-server from main before any
# release includes it: a rolling `nightly` GitHub pre-release, replaced on
# each run, and ghcr.io/<owner>/kerstel-server:nightly. Nothing here touches a
# v* tag, and /releases/latest never points at a pre-release, so
# `kerstel update` and install.sh never see a nightly.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if main has not changed since the last nightly
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          published="$(git ls-remote origin refs/tags/nightly | cut -f1)"
          base="$(jq -r .version packages/server/package.json)"
          version="${base}-nightly.$(date -u +%Y%m%d)+$(git rev-parse --short=7 HEAD)"
          publish=true
          if [ "$sha" = "$published" ] && [ "$FORCE" != "true" ]; then
            publish=false
            echo "main is still at $sha, the commit the last nightly was built from. Nothing to publish."
          fi
          {
            echo "publish=$publish"
            echo "sha=$sha"
            echo "version=$version"
            # Image tags cannot contain "+".
            echo "tag=${version//+/-}"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  test:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/server typecheck
      - run: bun test packages/server

  build:
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Cross-compile
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p nightly
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            bun build packages/server/src/index.ts --compile --no-compile-autoload-dotenv \
              --define "KERSTEL_SERVER_VERSION=\"$VERSION\"" \
              --target="bun-$target" --outfile "nightly/kerstel-server-$target"
          done
          cd nightly && sha256sum kerstel-server-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nightly
          path: nightly/

  smoke:
    # No checkout: the binary must run with no source tree on the machine.
    needs: [check, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, asset: kerstel-server-linux-x64 }
          - { runner: ubuntu-24.04-arm, asset: kerstel-server-linux-arm64 }
          - { runner: macos-14, asset: kerstel-server-darwin-arm64 }
          - { runner: macos-15-intel, asset: kerstel-server-darwin-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly
          path: ${{ runner.temp }}/nightly
      - name: Smoke test ${{ matrix.asset }}
        env:
          EXPECTED_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work" && cd "$work"
          cp "$RUNNER_TEMP/nightly/${{ matrix.asset }}" ./kerstel-server
          chmod +x ./kerstel-server
          test "$(./kerstel-server --version)" = "$EXPECTED_VERSION"
          # Built with --no-compile-autoload-dotenv: a .env in the working
          # directory must not move the server off its default address.
          echo "KERSTEL_SERVER_LISTEN=127.0.0.1:18788" > .env
          ./kerstel-server --db "$work/server.db" &
          pid=$!
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8787/v1/health > health.json 2>/dev/null; then break; fi
            sleep 0.2
          done
          kill "$pid"
          grep -q "\"version\":\"$EXPECTED_VERSION\"" health.json

  publish:
    needs: [check, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly
          path: nightly
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          **Preview build of \`kerstel-server\` from \`main\` at ${SHA:0:7}.** Not a release: it can change or break at any time, and the protocol may change before 0.3.0. The \`ks sync\` client has not shipped yet.

          Version \`$VERSION\`. Verify a download with \`SHA256SUMS\`.

          \`\`\`bash
          docker run -d -p 127.0.0.1:8787:8787 -v kerstel-server:/data ghcr.io/$GITHUB_REPOSITORY_OWNER/kerstel-server:nightly
          \`\`\`

          The image is also tagged \`$TAG\`. Serve it behind a proxy that terminates TLS: see [packages/server](https://github.com/$GITHUB_REPOSITORY/tree/$SHA/packages/server).
          NOTES
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly nightly/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Nightly $(date -u +%Y-%m-%d) (${SHA:0:7})" \
            --notes-file notes.md \
            --prerelease \
            --latest=false

  image:
    needs: [check, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          sparse-checkout: packages/server/Dockerfile
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: nightly
          path: nightly
      - name: Assemble the build context
        run: |
          set -euo pipefail
          mkdir -p context/amd64 context/arm64 context/data
          cp nightly/kerstel-server-linux-x64 context/amd64/kerstel-server
          cp nightly/kerstel-server-linux-arm64 context/arm64/kerstel-server
          cp packages/server/Dockerfile context/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kerstel-server:nightly
            ghcr.io/${{ github.repository_owner }}/kerstel-server:${{ needs.check.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.description=Kerstel sync server (nightly preview). Stores only ciphertext.
            org.opencontainers.image.licenses=MIT
      - name: Smoke test the image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kerstel-server:${{ needs.check.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          test "$(docker run --rm "$IMAGE" --version)" = "$EXPECTED_VERSION"
          docker run -d --name ks -p 127.0.0.1:18787:8787 -v ks-data:/data "$IMAGE"
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18787/v1/health > health.json 2>/dev/null; then break; fi
            sleep 0.2
          done
          docker logs ks
          docker rm -f ks
          grep -q "\"version\":\"$EXPECTED_VERSION\"" health.json

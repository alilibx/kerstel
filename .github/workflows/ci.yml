name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # e2e.test.ts runs the COMPILED binary. Without this the binary does not
      # exist in this job, so the one suite that proves the shipped artifact
      # works end to end never gates anything.
      - run: bun run --cwd packages/cli build
      - run: bun test

  # kerstel-server --domain against Pebble, Let's Encrypt's test CA. Pebble
  # treats every challenge as valid, so nothing needs to reach port 80.
  acme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Start Pebble
        run: |
          docker run -d --name pebble -p 14000:14000 \
            -e PEBBLE_VA_ALWAYS_VALID=1 -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=0 \
            ghcr.io/letsencrypt/pebble:2.10.1
          for _ in $(seq 1 30); do
            curl -sfk https://localhost:14000/dir > /dev/null && exit 0
            sleep 1
          done
          docker logs pebble
          exit 1
      - run: bun test packages/server/test/acme-pebble.test.ts
        env:
          KERSTEL_TEST_PEBBLE_DIRECTORY: https://localhost:14000/dir

  # `ks sync setup` over real ssh against this runner: the wizard installs
  # kerstel-server with Docker and as a systemd service, from an image and a
  # release mirror built here for this checkout's version.
  wizard-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Build the CLI, kerstel-server and its image
        run: |
          set -euo pipefail
          version="$(jq -r .version packages/cli/package.json)"
          test "$(jq -r .version packages/server/package.json)" = "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bun run --cwd packages/cli build
          # As release.yml builds it.
          bun build packages/server/src/index.ts --compile --no-compile-autoload-dotenv \
            --define "KERSTEL_SERVER_VERSION=\"$version\"" \
            --target=bun-linux-x64 --outfile dist/kerstel-server-linux-x64
          test "$(dist/kerstel-server-linux-x64 --version)" = "$version"
          # The installer finds this tag locally, so nothing is pulled.
          context="$RUNNER_TEMP/image"
          mkdir -p "$context/amd64" "$context/data"
          cp dist/kerstel-server-linux-x64 "$context/amd64/kerstel-server"
          cp packages/server/Dockerfile "$context/Dockerfile"
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 -t "ghcr.io/alilibx/kerstel-server:$version" "$context"
          test "$(docker run --rm "ghcr.io/alilibx/kerstel-server:$version" --version)" = "$version"
      - name: Serve a release mirror on 127.0.0.1
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mirror/releases/download/v$VERSION"
          mkdir -p "$dir"
          cp dist/kerstel-server-linux-x64 packages/server/install/kerstel-server.sh "$dir/"
          (cd "$dir" && sha256sum kerstel-server-linux-x64 kerstel-server.sh > SHA256SUMS)
          nohup python3 -m http.server 18080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/mirror" \
            > "$RUNNER_TEMP/mirror.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null "http://127.0.0.1:18080/releases/download/v$VERSION/SHA256SUMS" && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/mirror.log"
          exit 1
      - name: Start sshd on 127.0.0.1:2222 for this user
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/ssh"
          mkdir -m 700 "$d"
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -q && sudo apt-get install -y -q openssh-server
          fi
          ssh-keygen -q -t ed25519 -N '' -f "$d/host_key"
          ssh-keygen -q -t ed25519 -N '' -f "$d/client_key"
          cp "$d/client_key.pub" "$d/authorized_keys"
          sudo mkdir -p /run/sshd
          # No system config: only these settings. The key goes in its own
          # file, so ~/.ssh is left alone. UsePAM accepts the runner user's
          # key even though the account has no password.
          sudo /usr/sbin/sshd -f /dev/null -E "$d/sshd.log" \
            -o ListenAddress=127.0.0.1 -o Port=2222 -o HostKey="$d/host_key" -o PidFile="$d/sshd.pid" \
            -o AuthorizedKeysFile="$d/authorized_keys" -o StrictModes=no -o UsePAM=yes \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o AllowUsers="$(id -un)"
          cat > "$d/config" <<EOF
          Host kerstel-test
            HostName 127.0.0.1
            Port 2222
            User $(id -un)
            IdentityFile $d/client_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile $d/known_hosts
            LogLevel ERROR
          EOF
          echo "KERSTEL_TEST_SSH_CONFIG=$d/config" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            ssh -F "$d/config" kerstel-test true && exit 0
            sleep 0.2
          done
          sudo cat "$d/sshd.log"
          exit 1
      - name: Run the setup wizard over ssh
        run: bun test packages/cli/test/sync-wizard-ssh.test.ts
        env:
          KERSTEL_TEST_SSH_HOST: kerstel-test
          KERSTEL_RELEASES_URL: http://127.0.0.1:18080
      - name: Show the logs
        if: failure()
        run: |
          sudo cat "$RUNNER_TEMP/ssh/sshd.log" || true
          cat "$RUNNER_TEMP/mirror.log" || true
          docker logs kerstel-server || true
          sudo journalctl -u kerstel-server --no-pager || true
      - name: Stop sshd and the mirror
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ssh/sshd.pid" ]; then sudo kill "$(cat "$RUNNER_TEMP/ssh/sshd.pid")" || true; fi
          pkill -f 'http.server 18080' || true
          docker image rm "ghcr.io/alilibx/kerstel-server:$VERSION" || true
          rm -rf "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/mirror" "$RUNNER_TEMP/image" "$RUNNER_TEMP/mirror.log"

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/cli build
      - run: ./dist/kerstel --help

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/website build
      # docs/ is committed build output. A page edit without a rebuild shows up
      # here as a diff and fails the job, so kerstel.dev can never go stale.
      # Stage all changes to docs/ first to catch newly-created files too.
      - run: git add -A -- docs/ && git diff --cached --exit-code -- docs/
      - run: shellcheck apps/website/src/static/install.sh
      - run: shellcheck packages/server/install/kerstel-server.sh
      - run: bun test apps/website

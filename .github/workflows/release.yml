name: Release
# Plan-5 spec §4. Push a v* tag to release. A pre-release tag (v0.1.0-rc.1)
# runs the same pipeline and publishes a GitHub pre-release. Each release
# carries the CLI, kerstel-server (sync spec §9.1) and Kerstel Terminal
# (apps/terminal), and pushes the server image to ghcr.io/<owner>/kerstel-server.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, so two tags can't push images out of order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - id: verify
        run: bun scripts/release-verify.ts "$GITHUB_REF_NAME" release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/hook build
      - name: Cross-compile
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun build packages/cli/src/index.ts --compile --target="bun-$target" --outfile "release/kerstel-$target"
            # Without the define the server reports "<version>-dev". Without
            # --no-compile-autoload-dotenv a .env where it starts could move it.
            bun build packages/server/src/index.ts --compile --no-compile-autoload-dotenv \
              --define "KERSTEL_SERVER_VERSION=\"$VERSION\"" \
              --target="bun-$target" --outfile "release/kerstel-server-$target"
          done
          # The installer ships beside the binaries, so SHA256SUMS covers it.
          cp packages/server/install/kerstel-server.sh release/kerstel-server.sh
          cd release && sha256sum kerstel-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: release/

  smoke:
    # No checkout: the binary must work with no source tree on the machine.
    needs: [verify, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, asset: kerstel-darwin-arm64, server: kerstel-server-darwin-arm64 }
          - { runner: macos-15-intel, asset: kerstel-darwin-x64, server: kerstel-server-darwin-x64 }
          - { runner: ubuntu-latest, asset: kerstel-linux-x64, server: kerstel-server-linux-x64 }
          - { runner: ubuntu-24.04-arm, asset: kerstel-linux-arm64, server: kerstel-server-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test ${{ matrix.asset }}
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work" && cd "$work"
          cp "$RUNNER_TEMP/release/${{ matrix.asset }}" ./kerstel
          chmod +x ./kerstel
          export KERSTEL_HOME="$work/home" KERSTEL_KEYCHAIN_BACKEND=file

          test "$(./kerstel --version)" = "$EXPECTED_VERSION"

          printf 'smoke-value' | ./kerstel set global/SMOKE_KEY
          test "$(./kerstel get global/SMOKE_KEY --reveal)" = "smoke-value"

          ./kerstel daemon start
          printf 'process.stdout.write(String(process.env.SMOKE_KEY))' > app.cjs
          out="$(SMOKE_KEY=kerstel://global/SMOKE_KEY ./kerstel exec -- node app.cjs)"
          ./kerstel daemon stop
          test "$out" = "smoke-value"

      - name: Smoke test ${{ matrix.server }}, with this CLI syncing to it
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/server"
          mkdir -p "$work" && cd "$work"
          cp "$RUNNER_TEMP/release/${{ matrix.server }}" ./kerstel-server
          cp "$RUNNER_TEMP/release/${{ matrix.asset }}" ./kerstel
          chmod +x ./kerstel-server ./kerstel
          test "$(./kerstel-server --version)" = "$EXPECTED_VERSION"

          # A .env here must not move the server off its default address.
          echo "KERSTEL_SERVER_LISTEN=127.0.0.1:18788" > .env
          ./kerstel-server --db "$work/server.db" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8787/v1/health > health.json 2>/dev/null; then break; fi
            sleep 0.2
          done
          grep -q "\"version\":\"$EXPECTED_VERSION\"" health.json
          rm .env

          # The released client and server speak the same protocol.
          export KERSTEL_HOME="$work/home" KERSTEL_KEYCHAIN_BACKEND=file
          printf 'synced-value' | ./kerstel set global/SYNC_KEY
          ./kerstel sync setup http://127.0.0.1:8787 --yes
          ./kerstel sync
          ./kerstel sync status | grep -q '127.0.0.1:8787'

      - name: Keychain in a terminal ${{ matrix.asset }}
        # The step above uses the file backend. This one uses the real login
        # Keychain, inside a pseudo-terminal from `script`: `security` behaves
        # differently with a terminal attached, and a first run that stops to
        # prompt for the key only shows up there. perl's alarm is the timeout
        # macOS lacks, so a prompt fails the step instead of hanging it.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/keychain"
          mkdir -p "$work" && cd "$work"
          cp "$RUNNER_TEMP/release/${{ matrix.asset }}" ./kerstel
          chmod +x ./kerstel
          export KERSTEL_HOME="$work/home" KERSTEL_KEYCHAIN_SERVICE=dev.kerstel.vault.smoke
          trap 'security delete-generic-password -a kerstel -s "$KERSTEL_KEYCHAIN_SERVICE" >/dev/null 2>&1 || true' EXIT

          printf 'keychain-value' > value.txt
          perl -e 'alarm 30; exec @ARGV' script -q /dev/null sh -c './kerstel set global/KC_KEY < value.txt' < /dev/null
          ./kerstel doctor | grep -q 'macOS Keychain'
          test "$(./kerstel get global/KC_KEY --reveal)" = "keychain-value"

  app:
    # Kerstel Terminal, with this release's kerstel inside (apps/terminal runs
    # scripts/sidecar.ts before bundling). macOS builds are signed and
    # notarized when the APPLE_* secrets are set (see AGENTS.md, Releasing).
    # Without them the .dmg is unsigned and the job summary says so.
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, os: macos, arch: arm64, bundles: dmg }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, os: macos, arch: x64, bundles: dmg }
          # 22.04, so the AppImage and .deb run on older glibc too.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, os: linux, arch: x64, bundles: "deb,appimage" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/terminal/src-tauri -> target"
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - name: Tauri CLI
        run: cargo tauri --version 2>/dev/null || cargo install tauri-cli --version "=2.12.6" --locked
      - name: Signing identity
        id: signing
        if: matrix.os == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Pass the variables to the build only when they're set: Tauri treats
          # an empty APPLE_SIGNING_IDENTITY as an identity and fails.
          put() { { echo "$1<<APPLE_EOF"; printf '%s\n' "$2"; echo "APPLE_EOF"; } >> "$GITHUB_ENV"; }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              put APPLE_ID "$APPLE_ID"
              put APPLE_PASSWORD "$APPLE_PASSWORD"
              put APPLE_TEAM_ID "$APPLE_TEAM_ID"
              echo "notarized=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID is missing: the .dmg is signed but not notarized."
              echo "⚠️ Kerstel Terminal (${{ matrix.arch }}) is **signed but not notarized**: set APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::No Apple signing secrets: the Kerstel Terminal .dmg is unsigned. macOS will warn when it's opened."
            echo "⚠️ Kerstel Terminal (${{ matrix.arch }}) is **unsigned**: set the APPLE_* secrets (AGENTS.md, Releasing)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        working-directory: apps/terminal/src-tauri
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: cargo tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config "{\"version\":\"$VERSION\"}"
      - name: Collect
        run: |
          set -euo pipefail
          b="apps/terminal/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          if [ "${{ matrix.os }}" = macos ]; then
            cp "$b"/dmg/*.dmg "out/kerstel-terminal-macos-${{ matrix.arch }}.dmg"
          else
            cp "$b"/deb/*.deb "out/kerstel-terminal-linux-${{ matrix.arch }}.deb"
            cp "$b"/appimage/*.AppImage "out/kerstel-terminal-linux-${{ matrix.arch }}.AppImage"
          fi
          ls -la out
      - name: Smoke test
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTARIZED: ${{ steps.signing.outputs.notarized }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = macos ]; then
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" out/*.dmg
            app="$RUNNER_TEMP/dmg/Kerstel Terminal.app"
            test -x "$app/Contents/MacOS/kerstel-terminal"
            test "$("$app/Contents/MacOS/kerstel" --version)" = "$EXPECTED_VERSION"
            if [ "$SIGNED" = true ]; then codesign --verify --deep --strict --verbose=2 "$app"; fi
            if [ "$NOTARIZED" = true ]; then spctl --assess --type execute --verbose "$app"; xcrun stapler validate "$app"; fi
            hdiutil detach "$RUNNER_TEMP/dmg"
          else
            sudo apt-get install -y ./out/kerstel-terminal-linux-${{ matrix.arch }}.deb
            test -x /usr/bin/kerstel-terminal
            test "$(/usr/bin/kerstel --version)" = "$EXPECTED_VERSION"
            cd "$RUNNER_TEMP" && cp "$GITHUB_WORKSPACE"/out/*.AppImage app.AppImage && chmod +x app.AppImage
            ./app.AppImage --appimage-extract >/dev/null
            test "$(squashfs-root/usr/bin/kerstel --version)" = "$EXPECTED_VERSION"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}-${{ matrix.arch }}
          path: out/

  image:
    # Before the GitHub Release: a failed push must leave no release that the
    # docs' `docker run` line can't pull.
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/server/Dockerfile
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: release
      - name: Assemble the build context and the tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kerstel-server
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          mkdir -p context/amd64 context/arm64 context/data
          cp release/kerstel-server-linux-x64 context/amd64/kerstel-server
          cp release/kerstel-server-linux-arm64 context/arm64/kerstel-server
          cp packages/server/Dockerfile context/Dockerfile
          # A pre-release gets only its own tag (0.3.0-rc.1). A release also
          # moves 0.3 and latest, but only forward: re-running an older
          # release's workflow must not hand `latest` back to it.
          minor="${VERSION%.*}"
          released="$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          newest="$(printf '%s\n' $released "$VERSION" | sort -V | tail -1)"
          newest_minor="$(printf '%s\n' $released "$VERSION" | awk -v p="$minor." 'index($0, p) == 1' | sort -V | tail -1)"
          {
            echo "tags<<TAGS"
            echo "$IMAGE:${GITHUB_REF_NAME#v}"
            if [ "$PRERELEASE" != "true" ]; then
              if [ "$newest_minor" = "$VERSION" ]; then echo "$IMAGE:$minor"; fi
              if [ "$newest" = "$VERSION" ]; then echo "$IMAGE:latest"; fi
            fi
            echo "TAGS"
            echo "first=$IMAGE:${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.description=Kerstel sync server. Stores only ciphertext.
            org.opencontainers.image.licenses=MIT
      - name: Smoke test the image
        env:
          IMAGE: ${{ steps.tags.outputs.first }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          test "$(docker run --rm "$IMAGE" --version)" = "$EXPECTED_VERSION"
          docker run -d --name ks -p 127.0.0.1:18787:8787 -v ks-data:/data "$IMAGE"
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18787/v1/health > health.json 2>/dev/null; then break; fi
            sleep 0.2
          done
          docker logs ks
          docker rm -f ks
          grep -q "\"version\":\"$EXPECTED_VERSION\"" health.json

  publish:
    needs: [verify, smoke, image, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Checksums, with Kerstel Terminal
        run: cd release && sha256sum kerstel-* > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kerstel ${GITHUB_REF_NAME#v}" \
            --notes-file notes/release-notes.md \
            $flag

  installer:
    # The real one-liner against the release just published. Pinned to this
    # tag, because "latest" never points at a pre-release.
    needs: [verify, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          export KERSTEL_VERSION="${GITHUB_REF_NAME#v}" KERSTEL_INSTALL_DIR="$RUNNER_TEMP/bin"
          curl -fsSL https://kerstel.dev/install.sh | bash
          test "$("$KERSTEL_INSTALL_DIR/kerstel" --version)" = "$EXPECTED_VERSION"
          test "$("$KERSTEL_INSTALL_DIR/ks" --version)" = "$EXPECTED_VERSION"
